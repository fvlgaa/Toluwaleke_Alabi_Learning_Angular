<p>hair-list-item works!</p>
<div class="hair-product">
  <h2>{{ product.name }}</h2>
  <p><strong>Type:</strong> {{ product.type }}</p>
  <p><strong>Price:</strong> ${{ product.price }}</p>
  <p><strong>Organic:</strong> {{ product.isOrganic ? 'Yes' : 'No' }}</p>
  <p *ngIf="product.description"><strong>Description:</strong> {{ product.description }}</p>
  <img ngSrc="product.imageUrl" alt="{{ product.name }}" class="product-image" />
</div>
