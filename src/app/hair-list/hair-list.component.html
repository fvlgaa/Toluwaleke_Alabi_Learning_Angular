<h1>Hair List</h1>

<div *ngIf="hairList.length === 0">
  <p>No products available</p>
</div>

<div *ngFor="let hair of hairList; let i = index" class="hair-product-item">
  <app-hair-list-item
    [product]="hair"
    [ngClass]="{'even-item': i % 2 === 0, 'odd-item': i % 2 === 1}">
  </app-hair-list-item>

  <div class="action-buttons">
    <button
      (click)="onEdit(hair.id)"
      class="btn edit-btn"
      [appFocus]="'lightblue'"
      [appHoverHighlight]="'lightyellow'">Edit</button>
    <button
      (click)="onDelete(hair.id)"
      class="btn delete-btn"
      [appFocus]="'lightcoral'"
      [appHoverHighlight]="'lightgreen'">Delete</button>
  </div>
</div>
