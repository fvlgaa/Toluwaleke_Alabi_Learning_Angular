<mat-card class="modify-form-card">
  <mat-card-title>
    {{ hairProduct ? 'Edit Hair Product' : 'Add Hair Product' }}
  </mat-card-title>
  <form [formGroup]="modifyForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline">
      <mat-label>Product Name</mat-label>
      <input matInput formControlName="name" matTooltip="Enter product name" />
      <mat-error *ngIf="modifyForm.get('name')?.invalid && modifyForm.get('name')?.touched">
        Name is required.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Product Type</mat-label>
      <input matInput formControlName="type" matTooltip="e.g. Shampoo, Conditioner" />
      <mat-error *ngIf="modifyForm.get('type')?.invalid && modifyForm.get('type')?.touched">
        Type is required.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Price</mat-label>
      <input matInput type="number" formControlName="price" matTooltip="Enter price (USD)" />
      <mat-error *ngIf="modifyForm.get('price')?.invalid && modifyForm.get('price')?.touched">
        Price must be a positive number.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description (optional)</mat-label>
      <textarea matInput formControlName="description" matTooltip="Optional: Add product details"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Image URL</mat-label>
      <input matInput formControlName="imageUrl" matTooltip="Paste an image link (required)" />
      <mat-error *ngIf="modifyForm.get('imageUrl')?.invalid && modifyForm.get('imageUrl')?.touched">
        Image URL is required.
      </mat-error>
    </mat-form-field>

    <mat-checkbox formControlName="isOrganic" matTooltip="Check if the product is organic">
      Organic
    </mat-checkbox>

    <div class="form-actions">
      <button mat-raised-button color="primary" type="button" *ngIf="!hairProduct"
              [disabled]="modifyForm.invalid" (click)="onAdd()">Add</button>

      <button mat-raised-button color="accent" type="button" *ngIf="hairProduct"
              [disabled]="modifyForm.invalid" (click)="onUpdate()">Update</button>
    </div>
  </form>
</mat-card>
