<form [formGroup]="modifyForm" (ngSubmit)="onSubmit()">
  <h1>{{ hairProduct ? 'Edit Hair Product' : 'Add Hair Product' }}</h1>

  <div class="form-group">
    <label for="name">Product Name</label>
    <input id="name" formControlName="name" />
    <div *ngIf="modifyForm.get('name')?.invalid && modifyForm.get('name')?.touched">
      <small class="error">Name is required.</small>
    </div>
  </div>

  <div class="form-group">
    <label for="type">Product Type</label>
    <input id="type" formControlName="type" />
    <div *ngIf="modifyForm.get('type')?.invalid && modifyForm.get('type')?.touched">
      <small class="error">Type is required.</small>
    </div>
  </div>

  <div class="form-group">
    <label for="price">Price</label>
    <input id="price" formControlName="price" type="number" />
    <div *ngIf="modifyForm.get('price')?.invalid && modifyForm.get('price')?.touched">
      <small class="error">Price is required and must be a positive number.</small>
    </div>
  </div>

  <div class="form-group">
    <label for="isOrganic">Organic</label>
    <input type="checkbox" id="isOrganic" formControlName="isOrganic" />
  </div>

  <div class="form-group">
    <label for="description">Description (optional)</label>
    <textarea id="description" formControlName="description"></textarea>
  </div>

  <div class="form-group">
    <label for="imageUrl">Image URL</label>
    <input id="imageUrl" formControlName="imageUrl" />
    <div *ngIf="modifyForm.get('imageUrl')?.invalid && modifyForm.get('imageUrl')?.touched">
      <small class="error">Image URL is required.</small>
    </div>
  </div>

  <button type="button" *ngIf="!hairProduct" (click)="onAdd()" [disabled]="modifyForm.invalid">Add</button>
  <button type="button" *ngIf="hairProduct" (click)="onUpdate()" [disabled]="modifyForm.invalid">Update</button>
</form>
